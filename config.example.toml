# Copy to config.toml and edit. Every key is optional; defaults shown.
# Secrets are better passed as env vars: NTFY_TOPIC, DISCORD_WEBHOOK_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

chains = ["solana", "base", "ethereum"]
enable_pumpportal = true      # pump.fun new tokens + live trades (Solana only)
enable_dexscreener = true
enable_geckoterminal = true
enable_reddit = true
subreddits = ["memecoins", "solanamemecoins", "CryptoMoonShots", "SatoshiStreetBets"]

score_interval = 20           # seconds between scoring cycles
max_tracked_tokens = 300

# Phase-1 pre-filter: only tokens above these levels hit the safety APIs
min_volume_h1_usd = 10000
min_liquidity_usd = 3000
early_min_volume_m5_usd = 3000   # fast lane: a burst in the last 5 min gets checked right away

alert_threshold = 0.40
alert_stages = ["EARLY"]       # add "RUNNING" for more (later, riskier) alerts
alert_cooldown_minutes = 60
confirm_minutes = 0.0          # watch a qualifying coin this long before alerting (0 = alert right away)
confirm_max_drop_pct = 15.0    # ...and skip it if the price falls this much meanwhile
confirm_max_liq_drop_pct = 20.0
max_buyers_per_seller = 5.0   # skip one-sided "hype": more than 5 buyers per seller in 5 min
min_usd_per_buyer = 3.0       # skip "fake hype": 5-min volume under $3 per buyer means bots spraying tiny buys

db_path = "memeradar.db"
keep_days = 14                # delete score history older than this (alerts are kept)
dashboard_port = 8080

[weights]                     # W1..W5 – run `python -m memeradar tune` to fit these to your data
social_velocity = 0.25
volume_acceleration = 0.35
wallet_diversity = 0.25        # unique buyers vs sellers
liquidity_depth = 0.15
smart_money = 0.0              # off: only used if you add wallets to smart_wallets.txt

[safety]
max_top10_pct = 50.0
max_insider_pct = 40.0      # one hidden group of linked wallets may hold at most this %
max_insider_total_pct = 30.0  # all hidden groups added together may hold at most this %
max_tax_pct = 5.0
min_lp_locked_pct = 50.0
reject_mint_authority = true
reject_freeze_authority = true
allow_unverified = false

[stage]                       # EARLY / RUNNING / LATE / DUMPING detector
early_max_runup = 2.0         # EARLY only while price is under 2x its launch / 24h-ago level
late_runup = 8.0              # 8x or more -> LATE
dump_drawdown = 0.35          # 35% below the peak we saw -> DUMPING
late_drawdown = 0.20          # 20% below peak -> LATE
early_max_age_minutes = 240   # coins older than 4h are never EARLY
min_buyers_m5 = 10            # unique buyers in the last 5 min needed for EARLY
accel_ratio = 1.3             # buyers must be arriving 1.3x faster than the 10 min before
fade_ratio = 0.6              # below 0.6x = buyers drying up -> LATE (if it already ran 2x+)
sell_pressure = 1.3           # sellers > 1.3x buyers in last 5 min -> DUMPING

[exits]                       # exit alerts for coins that were alerted
take_profit_levels = [20.0, 100.0, 200.0, 300.0]   # YOUR money up this % after fees
take_profit_sell_pct = [0.0, 50.0, 25.0, 25.0]     # % of what you bought to sell at each (0 = sell nothing, just raise the stop)
stop_steps_behind = 1          # after a take profit, stop goes to the PREVIOUS level (0 = break-even after TP1)
trailing_stop_pct = 15.0      # 🔴 "get out" when it falls this % from its high since the alert...
trailing_arm_pct = 10.0       #    ...once it has been up at least this %
stop_loss_pct = 20.0          # 🔴 "stop loss" when YOUR money (after fees) is down this %
liquidity_drop_pct = 50.0     # 🔴 "rug warning" when half the pool's money is pulled
max_watch_hours = 6.0
check_interval = 3            # seconds between exit checks

[paper]                       # fake-money trading: buys on every entry alert, sells on the first red exit
enabled = true
start_balance_usd = 100.0
trade_usd = 10.0              # pretend amount spent per coin
fee_pct = 1.25                # per buy and per sell (estimate of real trading fees)
slippage_pct = 2.0            # buy a bit above / sell a bit below the quoted price
max_open = 5                  # most coins held at once

[steady]                      # 📈 second signal: steady climbers (own fake balance)
enabled = true
min_age_minutes = 30
max_age_hours = 24
min_h1_change_pct = 15.0      # up at least this % in the last hour
max_h1_change_pct = 80.0      # ...but not a rocket
min_m5_change_pct = -3.0      # still holding up in the last 5 min
max_m5_change_pct = 15.0      # ...and not spiking right now
max_h6_change_pct = 300.0
min_liquidity_usd = 20000
min_volume_h1_usd = 20000
min_buyers_h1 = 100

[grad]                        # 🎓 third signal: pump.fun graduation play (own fake balance)
enabled = true
graduation_sol = 410.0        # market cap (SOL) where a coin graduates
buy_min_sol = 160.0           # buy between ~40%...
buy_max_sol = 230.0           # ...and ~55% of the way
sell_at_sol = 370.0           # sell at ~90%, before the graduation dump
max_age_minutes = 60.0
min_buys_m5 = 25
min_buy_sell_ratio = 1.2
max_buy_sell_ratio = 8.0
min_usd_per_buy = 3.0
stop_loss_pct = 25.0          # YOUR money after fees
max_hold_minutes = 20.0
