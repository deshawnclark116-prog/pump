# Free 24/7-ish runner on GitHub Actions (public repos get unlimited free minutes).
# Each run lasts ~5h45m (GitHub's limit is 6h). The hourly timer queues the next run, so a new
# one starts about a minute after the last ends. The SQLite DB is kept in the Actions cache so
# history, alert cooldowns and exit tracking carry over between runs.
# Add a repository secret NTFY_TOPIC (and/or DISCORD_WEBHOOK_URL, TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID).
# Note: GitHub pauses timers after 60 days with no commits; re-enable from the Actions tab.
name: radar
on:
  push:
    branches: [ccr-bbdb2d78-8yqlgn]
    paths: ['memeradar/candidates.py', 'memeradar/forward_models.py', 'memeradar/pipeline.py', 'memeradar/attention/**', 'requirements.txt', '.github/workflows/radar.yml']
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
concurrency:
  group: radar
  # A new code push replaces a stale runner; ordinary hourly schedules never interrupt it.
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: check an alert channel is set
        env:
          ANY: ${{ secrets.NTFY_TOPIC }}${{ secrets.DISCORD_WEBHOOK_URL }}${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$ANY" ]; then
            echo "::error::Add a repository secret named NTFY_TOPIC (Settings > Secrets and variables > Actions)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: memeradar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-
      - name: radar
        run: python -m memeradar run --duration 20700
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Isolated research lane: the existing trading rules remain unchanged.
          ATTENTION_ENABLED: "1"
          ATTENTION_TELEGRAM_API_ID: ${{ secrets.ATTENTION_TELEGRAM_API_ID }}
          ATTENTION_TELEGRAM_API_HASH: ${{ secrets.ATTENTION_TELEGRAM_API_HASH }}
          ATTENTION_TELEGRAM_SESSION: ${{ secrets.ATTENTION_TELEGRAM_SESSION }}
          ATTENTION_TELEGRAM_CHANNELS: ${{ vars.ATTENTION_TELEGRAM_CHANNELS }}
          ATTENTION_X_BEARER_TOKEN: ${{ secrets.ATTENTION_X_BEARER_TOKEN }}
          ATTENTION_X_POST_BUDGET_PER_DAY: ${{ vars.ATTENTION_X_POST_BUDGET_PER_DAY }}
          ATTENTION_REDDIT_CLIENT_ID: ${{ secrets.ATTENTION_REDDIT_CLIENT_ID }}
          ATTENTION_REDDIT_CLIENT_SECRET: ${{ secrets.ATTENTION_REDDIT_CLIENT_SECRET }}
          ATTENTION_REDDIT_APPROVED: ${{ vars.ATTENTION_REDDIT_APPROVED }}
          ATTENTION_PAPER_ENABLED: "0"
      - name: alerts so far
        if: always() && hashFiles('memeradar.db') != ''
        run: |
          python -m memeradar report || true
          python -m memeradar paper || true
      - uses: actions/cache/save@v4
        if: always() && hashFiles('memeradar.db') != ''
        with:
          path: memeradar.db
          key: radar-db-${{ github.run_id }}
      - name: preserve research evidence
        if: always() && hashFiles('memeradar.db') != ''
        run: |
          mkdir -p research-output
          python - <<'PY'
          import json, os, sqlite3
          from datetime import datetime, timezone
          from pathlib import Path
          with sqlite3.connect('memeradar.db') as source:
              with sqlite3.connect('research-output/memeradar.db') as target:
                  source.backup(target)
          Path('research-output/provenance.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'exported_at': datetime.now(timezone.utc).isoformat(),
              'note': 'Ledger includes earlier rule versions. No secrets exported.'
          }, indent=2))
          PY
          python -m memeradar.research --db research-output/memeradar.db --audit --output research-output/audit.json
          python -m memeradar.attention --db research-output/memeradar.db status > research-output/attention-status.json
          python -m memeradar.research --db research-output/memeradar.db --since "$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)" --until "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --output research-output/replay.json
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('research-output/audit.json') != ''
        with:
          name: research-${{ github.run_id }}
          path: research-output/
          retention-days: 14

