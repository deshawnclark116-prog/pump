name: public attention tests
on:
  push:
    branches: [public-attention-feeds-20261107, ccr-bbdb2d78-8yqlgn]
    paths:
      - 'memeradar/attention/**'
      - 'memeradar/http.py'
      - 'tests/test_attention.py'
      - 'tests/test_public_attention.py'
      - '.github/workflows/public-attention-tests.yml'
  pull_request:
    branches: [ccr-bbdb2d78-8yqlgn]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Probe no-key feeds from GitHub Actions
        timeout-minutes: 4
        continue-on-error: true
        run: |
          python - <<'PY'
          import asyncio
          import json
          from memeradar.http import Http
          from memeradar.attention.db import connect, brief
          from memeradar.attention.public_sources import poll_public

          async def go():
              http = Http()
              db = connect(":memory:")
              try:
                  result = await poll_public(http, db)
                  stats = brief(db)
                  print(json.dumps({"polled": result, "social_hits": stats["attention_hits"],
                      "trending_rows": stats["attention_trends"], "sources": stats["sources"]},
                      indent=2))
              finally:
                  await http.close()
          asyncio.run(go())
          PY
