name: public attention tests
on:
  push:
    branches: [public-attention-feeds-20261107, ccr-bbdb2d78-8yqlgn]
    paths:
      - 'memeradar/attention/**'
      - 'memeradar/http.py'
      - 'tests/test_attention.py'
      - 'tests/test_public_attention.py'
      - '.github/workflows/public-attention-tests.yml'
  pull_request:
    branches: [ccr-bbdb2d78-8yqlgn]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
